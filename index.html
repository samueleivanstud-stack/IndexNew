<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esempio Testo HTML</title>
</head>
<body>

    <!-- Titoli -->
    <h1>Titolo Principale (H1)</h1>
    <h2>Sottotitolo (H2)</h2>

    <!-- Paragrafo standard -->
    <p>Questo è un semplice paragrafo di testo in HTML.</p>

    <!-- Formattazione del testo -->
    <p>In HTML puoi rendere il testo <strong>grassetto</strong>, <em>corsivo</em>, oppure <mark>evidenziato</mark>.</p>

    <!-- Elenco puntato -->
    <ul>
        <li>Primo elemento dell'elenco</li>
        <li>Secondo elemento dell'elenco</li>
    </ul>

</body>
</html>
